AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MaxSatt Forest Completion Trigger - Detects forests where all processings are completed and publishes NOTIFY events for downstream notification

Parameters:
  # ==================================================================================================
  #   Stack Config
  # ==================================================================================================
  Version:
    Type: String
    Description: Application version for tagging

  # ==================================================================================================
  #   Tags Config
  # ==================================================================================================
  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - hml
      - prd
    Description: Environment name

  Service:
    Type: String
    Default: maxsatt-forest-completion-trigger
    Description: Service name

  Application:
    Type: String
    Default: maxsatt-forest-completion-trigger
    Description: Application name

  # ==================================================================================================
  #   Log Group Config
  # ==================================================================================================
  LogsRetentionDays:
    Type: Number
    AllowedValues:
      - 90
      - 180
      - 1827
    Default: 90
    Description: CloudWatch Logs retention period in days

  # ==================================================================================================
  #   SQS Config
  # ==================================================================================================
  DelaySeconds:
    Type: Number
    Default: 0
    Description: Time in seconds that delivery of all messages in the queue is delayed

  MessageRetentionPeriod:
    Type: Number
    Default: 1209600
    Description: Number of seconds Amazon SQS retains a message (14 days)

  ReceiveMessageWaitTimeSeconds:
    Type: Number
    Default: 0
    Description: Time for which a ReceiveMessage call waits for a message to arrive

  VisibilityTimeout:
    Type: Number
    Default: 180
    Description: Visibility timeout for the queue (should be >= Lambda timeout)

  ForestCompletionTriggerQueueDLQName:
    Type: String
    Default: maxsatt-forest-completion-trigger-queue-dlq
    Description: Name of the DLQ for forest completion trigger messages

  ForestCompletionTriggerQueueName:
    Type: String
    Default: maxsatt-forest-completion-trigger-queue
    Description: Name of the main queue for forest completion trigger messages

  MaxReceiveCount:
    Type: Number
    Default: 3
    Description: Maximum number of receives before message goes to DLQ

  # ==================================================================================================
  #   SNS Config
  # ==================================================================================================
  SchedulerTriggerTopicName:
    Type: String
    Default: maxsatt-scheduler-trigger
    Description: Name of the SNS topic from scheduler-trigger (subscribes to receive scheduled events)

  ForestEventsTopicName:
    Type: String
    Default: forest-events-topic
    Description: Name of the SNS topic for forest events (publishes FOREST_ANALYSIS events)

  # ==================================================================================================
  #   Lambda Config
  # ==================================================================================================
  ImageUri:
    Type: String
    Description: ECR image URI for the Lambda function

  FunctionName:
    Type: String
    Default: maxsatt-forest-completion-trigger
    Description: Lambda function name

  MemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240
    Description: Lambda function memory size in MB

  Timeout:
    Type: Number
    Default: 120
    MinValue: 1
    MaxValue: 900
    Description: Lambda function timeout in seconds

  # ==================================================================================================
  #   Lambda Environment Config
  # ==================================================================================================
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: Application log level

  ForestScheduleIntervalDays:
    Type: Number
    Default: 5
    Description: Interval in days for forest schedule analysis

  APISecretArn:
    Type: String
    Description: ARN of the AWS Secrets Manager secret containing API credentials (JSON with client_id and client_secret)

  AuthURL:
    Type: String
    Description: OAuth2 authentication URL for API credentials

  AuthGtwId:
    Type: String
    Default: ""
    Description: API Gateway ID for authentication (optional)

  ForestFieldAPIURL:
    Type: String
    Description: Base URL for Forest Field API (MaxSatt API)

  # ==================================================================================================
  #   Notifications Config
  # ==================================================================================================
  DiscordWebhookURL:
    Type: String
    Default: ""
    Description: Discord webhook URL for error notifications (optional - leave empty to disable)

Resources:
  # ==================================================================================================
  #   IAM Roles
  # ==================================================================================================
  ForestCompletionTriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Service}-${Env}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Tags:
        - Key: env
          Value: !Ref Env
        - Key: service
          Value: !Ref Service
        - Key: stack
          Value: !Sub ${AWS::StackName}
        - Key: application
          Value: !Ref Application
        - Key: resource
          Value: iam_role

  # ==================================================================================================
  #   IAM Policies
  # ==================================================================================================
  ForestCompletionTriggerLambdaLogsPolicy:
    Type: AWS::IAM::Policy
    DependsOn:
      - ForestCompletionTriggerLambdaRole
      - ForestCompletionTriggerLambdaLogGroup
    Properties:
      PolicyName: !Sub ${Service}-${Env}-logs-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt ForestCompletionTriggerLambdaLogGroup.Arn
      Roles:
        - !Ref ForestCompletionTriggerLambdaRole

  ForestCompletionTriggerReceiveSqsMessagePolicy:
    Type: AWS::IAM::Policy
    DependsOn:
      - ForestCompletionTriggerLambdaRole
      - ForestCompletionTriggerQueue
    Properties:
      PolicyName: !Sub ${Service}-${Env}-receive-sqs-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt ForestCompletionTriggerQueue.Arn
      Roles:
        - !Ref ForestCompletionTriggerLambdaRole

  ForestCompletionTriggerSendToDLQPolicy:
    Type: AWS::IAM::Policy
    DependsOn:
      - ForestCompletionTriggerLambdaRole
      - ForestCompletionTriggerQueueDlq
    Properties:
      PolicyName: !Sub ${Service}-${Env}-send-dlq-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueUrl
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt ForestCompletionTriggerQueueDlq.Arn
      Roles:
        - !Ref ForestCompletionTriggerLambdaRole

  ForestCompletionTriggerPublishSnsPolicy:
    Type: AWS::IAM::Policy
    DependsOn:
      - ForestCompletionTriggerLambdaRole
    Properties:
      PolicyName: !Sub ${Service}-${Env}-publish-sns-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource:
              - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ForestEventsTopicName}
      Roles:
        - !Ref ForestCompletionTriggerLambdaRole

  ForestCompletionTriggerSecretsManagerPolicy:
    Type: AWS::IAM::Policy
    DependsOn:
      - ForestCompletionTriggerLambdaRole
    Properties:
      PolicyName: !Sub ${Service}-${Env}-secrets-manager-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Ref APISecretArn
      Roles:
        - !Ref ForestCompletionTriggerLambdaRole

  # ==================================================================================================
  #   CloudWatch Log Groups
  # ==================================================================================================
  ForestCompletionTriggerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: !Ref LogsRetentionDays
      Tags:
        - Key: env
          Value: !Ref Env
        - Key: service
          Value: !Ref Service
        - Key: stack
          Value: !Sub ${AWS::StackName}
        - Key: application
          Value: !Ref Application
        - Key: resource
          Value: log_group

  # ==================================================================================================
  #   SQS Queues - Input Queue (receives from scheduler-trigger SNS topic)
  # ==================================================================================================
  ForestCompletionTriggerQueueDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref ForestCompletionTriggerQueueDLQName
      MessageRetentionPeriod: !Ref MessageRetentionPeriod
      Tags:
        - Key: env
          Value: !Ref Env
        - Key: service
          Value: !Ref Service
        - Key: stack
          Value: !Sub ${AWS::StackName}
        - Key: application
          Value: !Ref Application
        - Key: resource
          Value: sqs_dlq

  ForestCompletionTriggerQueue:
    Type: AWS::SQS::Queue
    DependsOn:
      - ForestCompletionTriggerQueueDlq
    Properties:
      QueueName: !Ref ForestCompletionTriggerQueueName
      DelaySeconds: !Ref DelaySeconds
      MessageRetentionPeriod: !Ref MessageRetentionPeriod
      ReceiveMessageWaitTimeSeconds: !Ref ReceiveMessageWaitTimeSeconds
      VisibilityTimeout: !Ref VisibilityTimeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ForestCompletionTriggerQueueDlq.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: env
          Value: !Ref Env
        - Key: service
          Value: !Ref Service
        - Key: stack
          Value: !Sub ${AWS::StackName}
        - Key: application
          Value: !Ref Application
        - Key: resource
          Value: sqs_queue

  # ==================================================================================================
  #   SQS Queue Policy - Allow SNS to send messages to this queue
  # ==================================================================================================
  ForestCompletionTriggerQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    DependsOn:
      - ForestCompletionTriggerQueue
    Properties:
      Queues:
        - !Ref ForestCompletionTriggerQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSNSToSendMessage
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt ForestCompletionTriggerQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${SchedulerTriggerTopicName}

  # ==================================================================================================
  #   SNS Subscription - Subscribe to scheduler-trigger topic
  # ==================================================================================================
  ForestCompletionTriggerSnsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn:
      - ForestCompletionTriggerQueue
      - ForestCompletionTriggerQueuePolicy
    Properties:
      Protocol: sqs
      TopicArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${SchedulerTriggerTopicName}
      Endpoint: !GetAtt ForestCompletionTriggerQueue.Arn
      RawMessageDelivery: true
      FilterPolicy:
        event_type:
          - FOREST_COMPLETION_CHECK

  # ==================================================================================================
  #   Lambda Function
  # ==================================================================================================
  ForestCompletionTriggerLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - ForestCompletionTriggerLambdaLogGroup
      - ForestCompletionTriggerLambdaRole
      - ForestCompletionTriggerLambdaLogsPolicy
      - ForestCompletionTriggerReceiveSqsMessagePolicy
      - ForestCompletionTriggerSendToDLQPolicy
      - ForestCompletionTriggerPublishSnsPolicy
      - ForestCompletionTriggerSecretsManagerPolicy
      - ForestCompletionTriggerQueue
    Properties:
      FunctionName: !Ref FunctionName
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Role: !GetAtt ForestCompletionTriggerLambdaRole.Arn
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures:
        - arm64
      Environment:
        Variables:
          ENV: !Ref Env
          SERVICE_NAME: !Ref Service
          LOG_LEVEL: !Ref LogLevel
          AWS_SNS_REGION: !Sub ${AWS::Region}
          AWS_SQS_REGION: !Sub ${AWS::Region}
          AWS_SECRETS_MANAGER_REGION: !Sub ${AWS::Region}
          FOREST_EVENTS_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ForestEventsTopicName}
          FOREST_SCHEDULE_INTERVAL_DAYS: !Ref ForestScheduleIntervalDays
          API_SECRET: !Ref APISecretArn
          AUTH_URL: !Ref AuthURL
          AUTH_GTW_ID: !Ref AuthGtwId
          FOREST_FIELD_API_URL: !Ref ForestFieldAPIURL
          DLQ_URL: !Ref ForestCompletionTriggerQueueDlq
          DISCORD_ERROR_WEBHOOK_URL: !Ref DiscordWebhookURL
      Events:
        ForestCompletionEventConsumer:
          Type: SQS
          Properties:
            Queue: !GetAtt ForestCompletionTriggerQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            Enabled: true
      Tags:
        env: !Ref Env
        service: !Ref Service
        stack: !Sub ${AWS::StackName}
        application: !Ref Application
        version: !Ref Version
        resource: lambda

Outputs:
  # ==================================================================================================
  #   Outputs
  # ==================================================================================================
  LambdaFunctionArn:
    Description: ARN of the Forest Completion Trigger Lambda function
    Value: !GetAtt ForestCompletionTriggerLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaArn

  QueueArn:
    Description: ARN of the Forest Completion Trigger SQS queue
    Value: !GetAtt ForestCompletionTriggerQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-QueueArn

  QueueUrl:
    Description: URL of the Forest Completion Trigger SQS queue
    Value: !Ref ForestCompletionTriggerQueue
    Export:
      Name: !Sub ${AWS::StackName}-QueueUrl

  DLQArn:
    Description: ARN of the Forest Completion Trigger DLQ
    Value: !GetAtt ForestCompletionTriggerQueueDlq.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DLQArn
